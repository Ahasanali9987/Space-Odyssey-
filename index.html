<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Neon Drift</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050510;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
    canvas{display:block}
    #ui{position:absolute;bottom:0;left:0;width:100%;padding:14px 18px 18px;pointer-events:none;display:flex;justify-content:space-between;color:#fff;font-size:14px;font-weight:600;text-shadow:0 0 10px rgba(180,100,255,.4)}
    #ui .dist{color:#c4b5fd;font-size:16px}
    #start,#over{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0d0a1a 0%,#04040c 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:10;padding:24px}
    h1{font-size:34px;margin-bottom:6px;background:linear-gradient(90deg,#c4b5fd,#f0abfc,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sub{opacity:.6;font-size:13px;margin-bottom:22px}
    .btn{background:linear-gradient(135deg,#a78bfa,#e879f9);border:none;color:#fff;padding:13px 38px;font-size:16px;border-radius:50px;cursor:pointer;margin-top:16px;box-shadow:0 0 22px rgba(180,100,255,.4);pointer-events:auto}
    .btn:active{transform:scale(.95)}
    .info{max-width:300px;font-size:13px;line-height:1.55;opacity:.75;margin-top:16px}
    .score-big{font-size:42px;font-weight:800;margin:10px 0 4px;color:#c4b5fd}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div>BEST <span id="best">0</span></div>
  <div class="dist">DISTANCE <span id="dist">0</span></div>
</div>
<div id="start">
  <h1>NEON DRIFT</h1>
  <div class="sub">Hold to rise • Release to fall</div>
  <div class="info">
    Hold to fly up, release to drop.<br>
    Dodge comets, planets & asteroids<br>
    in deep space.
  </div>
  <button class="btn" id="go">LAUNCH</button>
</div>
<div id="over" style="display:none">
  <h1>DESTROYED</h1>
  <div class="score-big" id="final">0</div>
  <div style="opacity:.6;font-size:14px">Best: <span id="finalBest">0</span></div>
  <button class="btn" id="retry">TRY AGAIN</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

let actx=null;
function initAudio(){if(!actx)actx=new(AudioContext||webkitAudioContext);if(actx.state==='suspended')actx.resume()}
function tone(f,t,d,v=.06){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}
function sfxThrust(){tone(140+Math.random()*40,'sawtooth',.04,.02)}
function sfxCrash(){tone(70,'sawtooth',.4,.11);setTimeout(()=>tone(40,'square',.5,.08),60)}

let dist=0,best=0,active=false,holding=false,speed=3.3,grav=.26,lift=-.40,shake=0,frame=0,spawnTimer=0;
try{best=parseInt(localStorage.getItem('neonDriftBest')||'0')}catch(e){}
document.getElementById('best').textContent=best;

const ship={x:0,y:0,vy:0,rot:0};
const walls=[],objs=[],particles=[],stars=[];

function resetShip(){ship.x=W*.22;ship.y=H*.5;ship.vy=0;ship.rot=0}

function initStars(){
  stars.length=0;
  for(let i=0;i<70;i++) stars.push({x:Math.random()*W*3,y:Math.random()*H,s:.5+Math.random()*1.8,sp:.3+Math.random()*1.2});
}

function generateTerrain(){
  walls.length=0;objs.length=0;spawnTimer=0;
  for(let i=0;i<14;i++) walls.push({x:i*48,top:H*.12,bot:H*.88});
}

let seed=0;
function addSegment(){
  const last=walls[walls.length-1];
  const x=last.x+48;
  const t=seed*.055;
  const center=H*.5+Math.sin(t)*H*.15+Math.sin(t*1.8)*H*.06;
  const ht=H*(.46-Math.min(dist*.0001,.12));
  let top=Math.max(28,Math.min(H*.34,center-ht/2));
  let bot=Math.min(H-28,Math.max(H*.66,center+ht/2));
  walls.push({x,top,bot});
  seed++;
}

function spawnObj(){
  if(walls.length<4)return;
  const ref=walls[walls.length-2];
  const gap=ref.bot-ref.top;
  const x=ref.x+30;
  const r=Math.random();

  if(r<.28){
    // floating planet - slower
    const rad=28+Math.random()*24;
    const y=ref.top+30+Math.random()*(gap-rad*2-40);
    objs.push({x,y,r:rad,type:'planet',rot:0,hue:Math.random()*360,spd:0.55+Math.random()*0.25});
  } else if(r<.55){
    // comet - faster + diagonal
    const rad=16+Math.random()*12;
    const y=ref.top+25+Math.random()*(gap-50);
    objs.push({x,y,r:rad,type:'comet',vy:(Math.random()-.5)*1.8,trail:[],spd:1.35+Math.random()*0.4});
  } else if(r<.78){
    // asteroid - medium
    const rad=20+Math.random()*16;
    const y=ref.top+28+Math.random()*(gap-rad*2-35);
    objs.push({x,y,r:rad,type:'asteroid',rot:Math.random()*6,spd:0.9+Math.random()*0.3});
  } else {
    // crystal spike - normal scroll speed
    const h=80+Math.random()*60;
    if(Math.random()<.5) objs.push({x,y:ref.top,w:40,h,type:'spikeTop',spd:1});
    else objs.push({x,y:ref.bot-h,w:40,h,type:'spikeBot',spd:1});
  }
}

function drawShip(){
  ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.rot);

  // engine glow
  if(holding){
    const fl=12+Math.random()*14;
    const fg=ctx.createLinearGradient(-20,0,-20-fl,0);
    fg.addColorStop(0,'#e879f9');fg.addColorStop(.5,'#a78bfa');fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.moveTo(-18,-6);ctx.quadraticCurveTo(-18-fl*1.2,0,-18,6);ctx.fill();
  }

  // wings
  ctx.fillStyle='#7c3aed';
  ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-18,16);ctx.lineTo(4,8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-18,-16);ctx.lineTo(4,-8);ctx.closePath();ctx.fill();

  // body
  const g=ctx.createLinearGradient(-16,-8,20,8);
  g.addColorStop(0,'#6d28d9');g.addColorStop(.5,'#a78bfa');g.addColorStop(1,'#c4b5fd');
  ctx.beginPath();
  ctx.moveTo(20,0);ctx.quadraticCurveTo(12,-10,-8,-9);ctx.quadraticCurveTo(-16,-4,-16,0);
  ctx.quadraticCurveTo(-16,4,-8,9);ctx.quadraticCurveTo(12,10,20,0);
  ctx.closePath();ctx.fillStyle=g;ctx.fill();

  // cockpit
  ctx.beginPath();ctx.ellipse(6,0,7,5,0,0,Math.PI*2);
  ctx.fillStyle='rgba(224,231,255,.7)';ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(8,-1.5,2,0,Math.PI*2);ctx.fill();

  // accent line
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(14,0);ctx.stroke();

  ctx.restore();
}

function drawWalls(){
  ctx.fillStyle='#0f0a1e';
  ctx.beginPath();ctx.moveTo(walls[0].x-40,0);walls.forEach(w=>ctx.lineTo(w.x,w.top));ctx.lineTo(walls[walls.length-1].x+60,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(walls[0].x-40,H);walls.forEach(w=>ctx.lineTo(w.x,w.bot));ctx.lineTo(walls[walls.length-1].x+60,H);ctx.closePath();ctx.fill();

  ctx.strokeStyle='#2e1065';ctx.lineWidth=2;
  ctx.beginPath();walls.forEach((w,i)=>i?ctx.lineTo(w.x,w.top):ctx.moveTo(w.x,w.top));ctx.stroke();
  ctx.beginPath();walls.forEach((w,i)=>i?ctx.lineTo(w.x,w.bot):ctx.moveTo(w.x,w.bot));ctx.stroke();

  // nebula edge glow
  ctx.strokeStyle='rgba(167,139,250,.12)';ctx.lineWidth=3;
  ctx.beginPath();walls.forEach((w,i)=>i?ctx.lineTo(w.x,w.top+2):ctx.moveTo(w.x,w.top+2));ctx.stroke();
  ctx.beginPath();walls.forEach((w,i)=>i?ctx.lineTo(w.x,w.bot-2):ctx.moveTo(w.x,w.bot-2));ctx.stroke();
}

function drawObjs(){
  objs.forEach(o=>{
    if(o.type==='planet'){
      o.rot+=.01;
      // glow
      const gg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*1.8);
      gg.addColorStop(0,`hsla(${o.hue},70%,60%,.25)`);gg.addColorStop(1,'transparent');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(o.x,o.y,o.r*1.8,0,Math.PI*2);ctx.fill();
      // body
      const pg=ctx.createRadialGradient(o.x-o.r*.3,o.y-o.r*.3,0,o.x,o.y,o.r);
      pg.addColorStop(0,`hsl(${o.hue},80%,70%)`);pg.addColorStop(1,`hsl(${o.hue},70%,35%)`);
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
      // ring sometimes
      if(o.r>22){
        ctx.strokeStyle=`hsla(${o.hue+40},60%,70%,.5)`;ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(o.x,o.y,o.r*1.4,o.r*.35,o.rot,0,Math.PI*2);ctx.stroke();
      }
    }
    else if(o.type==='comet'){
      o.y+=o.vy;
      o.trail.push({x:o.x,y:o.y});if(o.trail.length>10)o.trail.shift();
      // trail
      o.trail.forEach((p,i)=>{
        const a=(i+1)/o.trail.length;
        ctx.globalAlpha=a*.6;ctx.fillStyle='#f0abfc';
        ctx.beginPath();ctx.arc(p.x,p.y,o.r*a*.7,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;
      // head
      const cg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      cg.addColorStop(0,'#fdf4ff');cg.addColorStop(.4,'#e879f9');cg.addColorStop(1,'#a21caf');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
    }
    else if(o.type==='asteroid'){
      o.rot+=.03;
      ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
      ctx.fillStyle='#78716c';
      ctx.beginPath();
      for(let i=0;i<7;i++){
        const a=(i/7)*Math.PI*2;
        const rr=o.r*(.7+Math.sin(i*2.3)*.3);
        i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(-o.r*.2,-o.r*.2,o.r*.35,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    else if(o.type==='spikeTop'||o.type==='spikeBot'){
      ctx.fillStyle='rgba(192,132,252,.15)';ctx.fillRect(o.x-3,o.y-3,o.w+6,o.h+6);
      const sg=ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);
      sg.addColorStop(0,'#7c3aed');sg.addColorStop(1,'#c026d3');
      ctx.fillStyle=sg;ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='rgba(237,233,254,.3)';ctx.fillRect(o.x,o.y,o.w,3);ctx.fillRect(o.x,o.y,3,o.h);
    }
  });
}

function burst(x,y,col,n=16){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:col,size:2+Math.random()*3})}}

function update(dt){
  if(holding){ship.vy+=lift;if(Math.random()<.3)sfxThrust()}else ship.vy+=grav;
  ship.vy*=.98;ship.vy=Math.max(-6.5,Math.min(7.2,ship.vy));ship.y+=ship.vy;
  ship.rot+=(ship.vy*.05-ship.rot)*.14;

  const scroll=speed;
  walls.forEach(w=>w.x-=scroll);
  // different speeds per object type
  objs.forEach(o=>{
    const mul = o.spd || 1;
    o.x -= scroll * mul;
    if(o.type==='comet'){
      o.y += o.vy;
      // ambient particles from comet
      if(Math.random()<0.4){
        particles.push({
          x:o.x+o.r, y:o.y+(Math.random()-0.5)*o.r,
          vx:1+Math.random()*2, vy:(Math.random()-0.5)*1.5,
          life:0.7+Math.random()*0.4, color:'#f0abfc', size:1.5+Math.random()*2
        });
      }
    }
    if(o.type==='planet' && Math.random()<0.08){
      // subtle planet dust
      particles.push({
        x:o.x+(Math.random()-0.5)*o.r*1.6, y:o.y+(Math.random()-0.5)*o.r*1.6,
        vx:(Math.random()-0.5)*.6, vy:(Math.random()-0.5)*.6,
        life:0.5+Math.random()*0.4, color:`hsla(${o.hue},70%,70%,1)`, size:1+Math.random()*1.5
      });
    }
  });
  while(walls.length&&walls[0].x<-100)walls.shift();
  for(let i=objs.length-1;i>=0;i--)if(objs[i].x<-80)objs.splice(i,1);
  while(walls[walls.length-1].x<W+140)addSegment();

  spawnTimer+=dt;
  const interval=Math.max(.7,1.25-dist*.00007);
  if(spawnTimer>interval){spawnObj();spawnTimer=0}

  dist+=scroll*.14;
  const d=Math.floor(dist);
  document.getElementById('dist').textContent=d;
  if(d>best){best=d;document.getElementById('best').textContent=best}
  speed=3.3+Math.min(dist*.0036,4.3);

  stars.forEach(s=>{s.x-=s.sp*speed*.4;if(s.x<0){s.x=W+20;s.y=Math.random()*H}});

  // ship engine particles when thrusting
  if(holding && Math.random()<0.5){
    particles.push({
      x:ship.x-18, y:ship.y+(Math.random()-0.5)*8,
      vx:-2-Math.random()*3, vy:(Math.random()-0.5)*2,
      life:0.5+Math.random()*0.4, color:Math.random()<.5?'#e879f9':'#a78bfa', size:2+Math.random()*2.5
    });
  }

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.018;if(p.life<=0)particles.splice(i,1)}

  const hx=ship.x,hy=ship.y;
  for(const w of walls){if(w.x>hx-50&&w.x<hx+50){if(hy-12<w.top||hy+12>w.bot){crash();return}}}
  for(const o of objs){
    if(o.type==='spikeTop'||o.type==='spikeBot'){
      if(hx+14>o.x&&hx-12<o.x+o.w&&hy+10>o.y&&hy-10<o.y+o.h){crash();return}
    } else {
      const dx=hx-o.x,dy=hy-o.y;
      if(Math.sqrt(dx*dx+dy*dy)<o.r+12){crash();return}
    }
  }
  if(hy<6||hy>H-6)crash();
}

function crash(){
  burst(ship.x,ship.y,'#e879f9',26);
  burst(ship.x,ship.y,'#c4b5fd',18);
  burst(ship.x,ship.y,'#f0abfc',14);
  burst(ship.x,ship.y,'#fff',12);
  // extra spark ring
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    particles.push({x:ship.x,y:ship.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,life:1,color:'#fdf4ff',size:2.5});
  }
  shake=14;sfxCrash();endGame();
}

function draw(){
  ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
  // stars
  stars.forEach(s=>{ctx.globalAlpha=.3+s.s*.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
  drawWalls();drawObjs();
  drawShip();
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
}

let last=0;
function loop(ts){if(!active)return;const dt=Math.min((ts-last)/1000,.05)||.016;last=ts;frame++;
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
  update(dt);draw();ctx.restore();requestAnimationFrame(loop)}

function setHold(v){holding=v;if(v)initAudio()}
canvas.addEventListener('mousedown',e=>{e.preventDefault();setHold(true)});
canvas.addEventListener('mouseup',()=>setHold(false));
canvas.addEventListener('mouseleave',()=>setHold(false));
canvas.addEventListener('touchstart',e=>{e.preventDefault();setHold(true)},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();setHold(false)},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();setHold(true)}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='ArrowUp')setHold(false)});

function startGame(){
  initAudio();document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';
  active=true;holding=false;dist=0;speed=3.3;shake=0;seed=0;frame=0;spawnTimer=0;
  particles.length=0;resetShip();generateTerrain();initStars();
  document.getElementById('dist').textContent='0';document.getElementById('best').textContent=best;
  last=performance.now();requestAnimationFrame(loop);
}
function endGame(){
  active=false;holding=false;const d=Math.floor(dist);
  if(d>best){best=d;try{localStorage.setItem('neonDriftBest',best)}catch(e){}}
  document.getElementById('final').textContent=d;document.getElementById('finalBest').textContent=best;document.getElementById('best').textContent=best;
  setTimeout(()=>document.getElementById('over').style.display='flex',380);
}
document.getElementById('go').onclick=startGame;
document.getElementById('retry').onclick=()=>{document.getElementById('over').style.display='none';startGame()};
</script>
</body>
</html>
